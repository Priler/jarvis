# Recovery validation scenarios (R1-R10)
#
# These scenarios verify that the runtime stabilization layer handles failure
# conditions correctly.  Each scenario references a WAV file (placed in
# tests/wavs/) and specifies assertions that must pass.
#
# Scenarios requiring hardware simulation (R2, R9) are annotated accordingly
# and will be skipped gracefully when the WAV file is absent.

name: recovery
wav_base: tests/wavs

scenarios:
  # R1: IPC client kill mid-session
  # After losing the WebSocket client, the server should clean up the
  # connection, re-broadcast Idle on the next event, and not leave any
  # orphan state.  A standard wake+command sequence is used; IPC health
  # is verified via A010.
  - name: wake_with_command
    must_pass: [A001, A005, A007, A008, A010]

  # R2: Audio device lost (hardware simulation required)
  # The watchdog should detect LAST_STT_FRAME_MS going stale, issue L2
  # recorder restart, and the app thread should recover or enter degraded
  # mode.  NOTE: requires physical mic disconnect; skipped in automated CI.
  - name: silence_timeout
    must_pass: [A001, A007, A008]

  # R3: Recognizer freeze (wake arrives, no transcript produced)
  # After WATCHDOG_AWAITING_CHAIN_MAX_MS the watchdog forces idle.
  # Verified via a silence-timeout scenario — the session must close cleanly.
  - name: silence_timeout
    must_pass: [A001, A007, A008]

  # R4: Playback overlap storm (speaking gate hit rapidly)
  # Multiple wake events in quick succession exercise the debounce and
  # speaking-gate logic.  All sessions must close without illegal transitions.
  - name: rapid_double_wake
    must_pass: [A008, A009]

  # R5: Wake during cooldown / playback interruption
  # A second wake word delivered while the assistant is speaking should be
  # caught by the interrupt engine and result in a clean session close.
  - name: rapid_double_wake
    must_pass: [A001, A008, A009]

  # R6: Panic in command execution (Lua/CLI)
  # A command that raises an error should not kill the pipeline.  The state
  # machine must return to Idle cleanly.
  - name: wake_with_command
    must_pass: [A001, A005, A007, A008, A010]

  # R7: Lua timeout
  # A Lua command that runs longer than the sandbox timeout must be
  # terminated and the pipeline must remain functional.
  - name: wake_with_command
    must_pass: [A001, A007, A008]

  # R8: Massive replay / batch spam
  # Running the harness over many WAVs in sequence must not leak sessions or
  # leave orphan global state between runs.
  - name: single_wake_no_command
    must_pass: [A001, A007, A008, A009]

  # R9: Reconnect storm (IPC)
  # Rapid client connect/disconnect cycles must not crash the IPC server or
  # leave zombie broadcast receivers.  NOTE: requires GUI automation; skipped
  # in automated WAV-only CI.
  - name: single_wake_no_command
    must_pass: [A008, A010]

  # R10: Dead recognizer (Vosk model not loaded)
  # If the STT engine was never initialised, the pipeline must fall back
  # gracefully and the session must close without illegal transitions.
  - name: single_wake_no_command
    must_pass: [A008, A009]
