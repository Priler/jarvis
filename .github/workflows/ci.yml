name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  frontend:
    name: Frontend — test & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

  rust:
    name: Rust — check, clippy, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libssl-dev pkg-config \
            libpulse-dev libasound2-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf \
            libglib2.0-dev libsecret-1-dev

      - name: cargo check (workspace)
        run: cargo check --workspace

      - name: cargo clippy (jarvis-core, no warnings)
        run: cargo clippy -p jarvis-core -- -D warnings

      - name: cargo test (jarvis-core)
        run: cargo test -p jarvis-core --no-default-features --features lua

  rust-windows:
    name: Rust — Windows check & test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo check (workspace)
        run: cargo check --workspace

      - name: cargo test (jarvis-core)
        run: cargo test -p jarvis-core --no-default-features --features lua
